name: FitnessCoach
options:
  bundleIdPrefix: com.cassie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  FitnessCoach:
    type: application
    platform: iOS
    sources:
      - path: FitnessCoach
    info:
      path: FitnessCoach/Info.plist
      properties:
        CFBundleDisplayName: AI 健身教练
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: 训练中用麦克风听你说话，把不适和反馈告诉教练。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字发给 AI 教练。识别在设备上完成。
        COACH_API_HOST: $(COACH_API_HOST)
        COACH_SHARED_SECRET: $(COACH_SHARED_SECRET)
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cassie.fitnesscoach
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: M7BPQ88622
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

  FitnessCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitnessCoachUITests
    dependencies:
      - target: FitnessCoach
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cassie.fitnesscoach.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FitnessCoach
        CODE_SIGNING_ALLOWED: NO
