# Vance backend — realtime.magicandgrind.com
# 这个 server 块需要加到 sourcerlinda 主仓库的 docker/nginx/nginx.conf 模板里
# 不能直接改 ECS 上的文件（会被 deploy 覆盖）

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name realtime.magicandgrind.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主入口
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name realtime.magicandgrind.com;

    ssl_certificate     /etc/letsencrypt/live/realtime.magicandgrind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realtime.magicandgrind.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket 升级（实时语音必须）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Worker：文字对话 + 计划生成
    location /api/ {
        proxy_pass http://vance-worker:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应需要
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Gateway：MiniMax Realtime WebSocket
    location /realtime {
        proxy_pass http://vance-gateway:8787/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Gateway 的 GymVision 等其他 HTTP 端点
    location /gateway/ {
        proxy_pass http://vance-gateway:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
