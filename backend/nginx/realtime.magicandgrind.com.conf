# Vance backend — realtime.magicandgrind.com
# These server blocks must be placed directly inside sourcerlinda's `http {}`
# block. sourcerlinda already defines `$connection_upgrade` at that level.
# Do not paste a `map` directive into either server block: nginx only permits
# `map` in `http {}`, and doing so prevents the entire shared nginx from
# starting.

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name realtime.magicandgrind.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主入口
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name realtime.magicandgrind.com;

    ssl_certificate     /etc/letsencrypt/live/realtime.magicandgrind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realtime.magicandgrind.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gateway: MiniMax Realtime WebSocket. This needs its own location because
    # the Worker also has a /realtime endpoint for its local-only fallback.
    location = /realtime {
        proxy_pass http://vance-gateway:8787/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Gateway's optional HTTP endpoints retain their `/api/...` paths after
    # the external `/gateway/` namespace is removed.
    location ^~ /gateway/ {
        proxy_pass http://vance-gateway:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The iOS app sends Worker requests at root paths (/coach/turn, /plan,
    # /vision/equipment, ...), so this must be the fallback rather than /api/.
    # Buffering is disabled for the coach's SSE stream.
    location / {
        proxy_pass http://vance-worker:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
